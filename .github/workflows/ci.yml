name: CI
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || format('CI {0}', github.ref_name) }}

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Check and build project
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    outputs:
      release_short_sha: ${{ steps.metadata.outputs.release_short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Resolve build metadata
        id: metadata
        run: |
          release_short_sha="$(git rev-parse --short HEAD)"
          echo "release_short_sha=$release_short_sha" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: just check

      - name: Build project
        run: just build

      - name: Write release metadata
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          printf '{"slug":"%s","sha":"%s","repository":"%s"}\n' \
            "${{ github.event.repository.name }}" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" > dist/release.json

      - name: Pack build archive
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: tar -czf dist.tar.gz -C dist .

      - name: Upload build archive
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-dist-${{ steps.metadata.outputs.release_short_sha }}
          path: dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.event.repository.name }}
          cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}
          platforms: linux/amd64

  static:
    name: Publish static artifact
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download build archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-dist-${{ needs.checks.outputs.release_short_sha }}
          path: .workflow/static

      - uses: oras-project/setup-oras@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable static artifact
        env:
          STATIC_ARTIFACT_TYPE: application/vnd.${{ github.event.repository.name }}.static.v1
          STATIC_MEDIA_TYPE: application/vnd.${{ github.event.repository.name }}.static.v1.tar+gzip
        run: |
          static_artifact="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/static/${{ github.event.repository.name }}"
          oras push \
            --artifact-type "$STATIC_ARTIFACT_TYPE" \
            "$static_artifact:$GITHUB_SHA" \
            ".workflow/static/dist.tar.gz:$STATIC_MEDIA_TYPE"
          oras tag "$static_artifact:$GITHUB_SHA" "${{ needs.checks.outputs.release_short_sha }}"

      - name: Push latest static channel
        run: |
          static_artifact="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/static/${{ github.event.repository.name }}"
          oras tag "$static_artifact:$GITHUB_SHA" latest
